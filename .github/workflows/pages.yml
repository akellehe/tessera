name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  # Every pull request builds and packages the docs, so a break is caught
  # before it reaches main rather than after, when it has already taken the
  # deploy down. The build steps below are shared with the deploy path by
  # construction, so a green check here means the deploy's build will pass.
  # Publishing stays on main: see the deploy job's condition.
  pull_request:
  workflow_dispatch:  # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so concurrent pull requests do not cancel one another; the
# single "pages" group would have let any new run kill an in-flight one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation
    # The project's own runners, in the same pinned image as build.yml. On the
    # GitHub-hosted runners the C++ compile below intermittently lost the
    # machine partway through ("The runner has received a shutdown signal",
    # exit code 143), so a red check said nothing about the documentation.
    # The 24.04 container gives the toolchain build.yml builds against.
    runs-on: [self-hosted, tessera]
    container:
      image: ubuntu:24.04
    timeout-minutes: 90
    env:
      # As in build.yml: a container-local tool cache, so setup-python resolves
      # a Python built for the image (its _ssl matches the image's OpenSSL),
      # and capped build parallelism, so the job is a good neighbour on the
      # shared runner boxes.
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
      TESSERA_CUDA: "0"
      # The compiler cache, shared with build.yml: the same launcher, cache
      # directory, size cap and compiler check, so the two workflows fill and
      # restore one archive per toolchain. build.yml's env block
      # explains each variable; the restore and save steps below are the
      # actions under .github/actions that both workflows use.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: "%compiler% -v"

    steps:
      - name: Install system dependencies
        # Runs before checkout on purpose: actions/checkout needs git, and the
        # base image has none. Container steps run as root, so there is no sudo.
        #
        # The docs build compiles the C++ extension (`pip install ".[dev]"`), so it
        # needs the same packages as build.yml: pybind11-dev for the
        # find_package(pybind11) cmake config, plus liblapack/libblas for the
        # quantum subsystem. doxygen produces the XML that breathe renders into
        # the C++ API pages. Without them the build fails, and on main so does
        # the deploy. ccache is the compiler cache the job env points CMake
        # at, and zstd is what actions/cache compresses the cache archive with.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential cmake ninja-build ccache zstd \
            doxygen pybind11-dev libeigen3-dev liblapack-dev libblas-dev

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The version build.yml's matrix compiles against. The binding units
      # include Python.h, so the compiler cache serves their objects to this
      # job only when it compiles against the same Python.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The same rule as build.yml's "Size the build for the memory available"
      # step: the heaviest translation units peak near 4.5 GiB in the compiler,
      # 4 GiB stays free for the page cache and the rest of the box, at most 8
      # jobs, at least 1. A fixed level of 8 fits primary01 (125 GB); on
      # workstation05 (29 GB) it filled the swap, and 6 jobs from 18 GiB
      # available thrashed the page cache until the job's limit cancelled it.
      - name: Size the build for the runner's memory
        run: |
          avail_mib=$(( $(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo) / 1024 ))
          level=$(( (avail_mib - 4096) / 4608 ))
          [ "$level" -gt 8 ] && level=8
          [ "$level" -lt 1 ] && level=1
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$level" >> "$GITHUB_ENV"
          echo "MemAvailable ${avail_mib} MiB -> CMAKE_BUILD_PARALLEL_LEVEL=${level}"

      - name: Restore the compiler cache
        id: ccache
        uses: ./.github/actions/compiler-cache-restore

      - name: Build and install the extension (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Right after the build, so a broken Sphinx build still keeps the
      # objects this job compiled for the next one.
      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/compiler-cache-save
        with:
          cache-hit: ${{ steps.ccache.outputs.cache-hit }}
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Install the documentation requirements
        run: pip install -r docs/requirements.txt

      # No pytest here: the suite exceeds the runner's time budget, and build.yml
      # already covers it. This workflow compiles the extension and builds the
      # docs; a green run asserts exactly that, on a pull request and on main
      # alike.
      - name: Build Sphinx HTML
        working-directory: docs
        run: |
          make html

      # Packaging runs on a pull request too. It is part of the deploy path and
      # can fail on its own, so a check that stopped at `make html` would not
      # prove the artifact is deployable.
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only main publishes. A pull request proves the artifact is deployable and
    # stops there; deploying an unmerged branch would overwrite the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

