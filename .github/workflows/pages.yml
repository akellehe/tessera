name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  # Every pull request builds and packages the docs, so a break is caught
  # before it reaches main rather than after, when it has already taken the
  # deploy down. The build steps below are shared with the deploy path by
  # construction, so a green check here means the deploy's build will pass.
  # Publishing stays on main: see the deploy job's condition.
  pull_request:
  workflow_dispatch:  # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so concurrent pull requests do not cancel one another; the
# single "pages" group would have let any new run kill an in-flight one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation
    # The project's own runners, in the same pinned image as build.yml. On the
    # GitHub-hosted runners the C++ compile below intermittently lost the
    # machine partway through ("The runner has received a shutdown signal",
    # exit code 143), so a red check said nothing about the documentation.
    # The 24.04 container gives the toolchain build.yml builds against.
    runs-on: [self-hosted, tessera]
    container:
      image: ubuntu:24.04
    timeout-minutes: 90
    env:
      # As in build.yml: a container-local tool cache, so setup-python resolves
      # a Python built for the image (its _ssl matches the image's OpenSSL),
      # and capped build parallelism, so the job is a good neighbour on the
      # shared runner boxes.
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
      TESSERA_CUDA: "0"
      CMAKE_BUILD_PARALLEL_LEVEL: "8"

    steps:
      - name: Install system dependencies
        # Runs before checkout on purpose: actions/checkout needs git, and the
        # base image has none. Container steps run as root, so there is no sudo.
        #
        # The docs build compiles the C++ extension (`pip install ".[dev]"`), so it
        # needs the same packages as build.yml: pybind11-dev for the
        # find_package(pybind11) cmake config, plus liblapack/libblas for the
        # quantum subsystem. doxygen produces the XML that breathe renders into
        # the C++ API pages. Without them the build fails, and on main so does
        # the deploy.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential cmake ninja-build \
            doxygen pybind11-dev libeigen3-dev liblapack-dev libblas-dev

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip
           pip install ".[dev]"
           pip install -r docs/requirements.txt

      # No pytest here: the suite exceeds the runner's time budget, and build.yml
      # already covers it. This workflow compiles the extension and builds the
      # docs; a green run asserts exactly that, on a pull request and on main
      # alike.
      - name: Build Sphinx HTML
        working-directory: docs
        run: |
          make html

      # Packaging runs on a pull request too. It is part of the deploy path and
      # can fail on its own, so a check that stopped at `make html` would not
      # prove the artifact is deployable.
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only main publishes. A pull request proves the artifact is deployable and
    # stops there; deploying an unmerged branch would overwrite the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

