name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-suite run (07:00 UTC) so the slow tests deselected on PR
    # pushes still gate the tree at least once a day, independent of merges.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# ``github.ref`` alone is not enough to separate these triggers: the nightly
# schedule and a merge into main both report ``refs/heads/main``, so a merge
# landing near 07:00 UTC used to cancel the nightly full-suite run outright
# (for example run 34573281330 on 2026-09-11). Keying on the event as well
# gives the schedule its own group, so only a newer run of the *same* trigger
# can cancel an in-flight one.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-install:
    name: pip install (py${{ matrix.python-version }})
    runs-on: [self-hosted, tessera]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      TESSERA_CUDA: "0"
      # The runner box is shared (other self-hosted runners + interactive use);
      # cap build and math-library parallelism so concurrent matrix jobs stay
      # good neighbors. Tunable.
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      OMP_NUM_THREADS: "8"
      # Total CPU threads the test lanes may occupy, and how many of them each
      # pytest-xdist worker gets. Worker count is the quotient, computed by
      # .github/scripts/test-workers.sh. Raising TESSERA_TEST_CPUS trades
      # neighbourliness on the shared box for a shorter lane.
      TESSERA_TEST_CPUS: "16"
      TESSERA_TEST_THREADS_PER_WORKER: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Install the distro pybind11 (currently v2) on purpose. Its CMake
      # config lands in /usr/lib/cmake/pybind11 — a default find_package()
      # search path — so a green run asserts the build still selects
      # pybind11 >= 3.0 and never falls back to the system v2.
      # liblapack/libblas satisfy the (unconditional) quantum subsystem's
      # BLAS/LAPACK need. Skipped on self-hosted, where these are already
      # installed system-wide and the runner user has no sudo.
      - name: Install system packages (incl. pybind11 v2 regression trap)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y pybind11-dev liblapack-dev libblas-dev

      - name: Build and install (with dev extras for the test suite)
        run: python -m pip install -e ".[dev]" -v

      - name: Import smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import tessera, tessera._tessera, tessera.quantum
          print("tessera  ->", tessera.__file__)
          print("_tessera ->", tessera._tessera.__file__)
          assert hasattr(tessera, "quantum"), "tessera.quantum is missing"
          print("quantum subsystem present")
          PY

      # The editable install above keeps conftest.py's xdist-unsafe build
      # fallback dormant (its fast path returns as soon as ``tessera._tessera``
      # imports), so the suite below can shard across workers safely.
      #
      # Thread budget: this suite is BLAS / OpenMP bound. Its heaviest tests
      # (cobordism relaxations, the example subprocesses) thread-scale, so a
      # naive OMP_NUM_THREADS=1 with a worker per core regresses: a
      # single-threaded long pole floors the wall clock and every worker
      # re-pays the heavy module imports. The split below spends the budget as
      # TESSERA_TEST_THREADS_PER_WORKER threads inside each test and
      # TESSERA_TEST_CPUS / TESSERA_TEST_THREADS_PER_WORKER tests at once.
      #
      # PR pushes run only the fast lane (the ``slow`` tests deselected);
      # merge-to-main, the nightly schedule, and manual dispatch run the FULL
      # suite. Coverage is split, never cut — every ``slow`` test still runs on
      # main/nightly. Both lanes run from the repo root so pytest finds tests/.
      - name: Run fast test suite (PR pushes)
        if: github.event_name == 'pull_request'
        env:
          OMP_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          OPENBLAS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          MKL_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          BLIS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
        run: |
          python -m pytest tests/ -q -m "not slow" \
            -n "$(.github/scripts/test-workers.sh)" --dist worksteal

      - name: Run full test suite (main / nightly / manual)
        if: github.event_name != 'pull_request'
        env:
          OMP_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          OPENBLAS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          MKL_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          BLIS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
        run: |
          python -m pytest tests/ -q \
            -n "$(.github/scripts/test-workers.sh)" --dist worksteal
