name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-suite run (07:00 UTC) so the slow tests deselected on PR
    # pushes still gate the tree at least once a day, independent of merges.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# ``github.ref`` alone is not enough to separate these triggers: the nightly
# schedule and a merge into main both report ``refs/heads/main``, so a merge
# landing near 07:00 UTC used to cancel the nightly full-suite run outright
# (for example run 34573281330 on 2026-09-11). Keying on the event as well
# gives the schedule its own group, so only a newer run of the *same* trigger
# can cancel an in-flight one.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-install:
    name: pip install (py${{ matrix.python-version }})
    runs-on: [self-hosted, tessera]
    # Pinned to 24.04 so every runner computes the same floats regardless of the
    # host OS. The golden dumps in tests/observables, tests/chainhodge and
    # tests/cobordism are reproducible only on the toolchain that generated
    # them, and "the toolchain" turned out to mean both the compiler and libm:
    # measured 2026-09-13, a 26.04 host (g++ 15.2 / glibc 2.43) fails four of
    # them, and pinning g++ 13 alone still leaves the cobordism dump diverging
    # in the near-degenerate regime, where a last-bit libm difference amplifies
    # into a macroscopic one. 24.04 gives g++ 13.3 + glibc 2.39, which is what
    # the dumps were generated against. Without this, whether a PR is red or
    # green depends on which runner happens to pick it up.
    container:
      image: ubuntu:24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      # Give the container its own tool cache.
      #
      # The runner's cache lives under _work/_tool, which is bind-mounted into
      # the container as /__w/_tool, so host and container share it. They do not
      # agree on OpenSSL: a self-hosted host may be a later Ubuntu than the
      # image pinned below -- 3.5.5 against the container's 3.0.13 when this
      # broke -- and a Python resolved from that shared cache in a host context
      # has _ssl linked against the host's. Inside the container the extension
      # will not load, `import ssl` fails, and pip loses HTTPS: every install
      # dies at "No matching distribution found".
      #
      # This path is container-local rather than under /__w, so setup-python
      # resolves a build made for the image. It costs a download per run, which
      # is the price of the cache being correct. AGENT_TOOLSDIRECTORY is the
      # documented knob for relocating the tool cache on self-hosted Ubuntu
      # runners.
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
      TESSERA_CUDA: "0"
      # The runner box is shared (other self-hosted runners + interactive use);
      # cap build and math-library parallelism so concurrent matrix jobs stay
      # good neighbors. Tunable.
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      OMP_NUM_THREADS: "8"
      # Total CPU threads the test lanes may occupy, and how many of them each
      # pytest-xdist worker gets. Worker count is the quotient, computed by
      # .github/scripts/test-workers.sh. Raising TESSERA_TEST_CPUS trades
      # neighbourliness on the shared box for a shorter lane.
      TESSERA_TEST_CPUS: "16"
      TESSERA_TEST_THREADS_PER_WORKER: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      # Runs before checkout on purpose: actions/checkout needs git, and the
      # base image has none. No sudo here (and none in the image) because a
      # container step is already root.
      #
      # Installing the distro pybind11 (currently v2) is deliberate. Its CMake
      # config lands in /usr/lib/cmake/pybind11 — a default find_package()
      # search path — so a green run asserts the build still selects
      # pybind11 >= 3.0 and never falls back to the system v2.
      # liblapack/libblas satisfy the (unconditional) quantum subsystem's
      # BLAS/LAPACK need.
      - name: Install the toolchain (incl. pybind11 v2 regression trap)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential cmake ninja-build \
            pybind11-dev libeigen3-dev liblapack-dev libblas-dev

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # CMakeLists.txt hard-requires GNU C++ 13.x. The 24.04 container already
      # ships it as plain `g++`, so this is a guard rather than a fixup: it
      # fails loudly if the image is ever bumped to a release whose default
      # compiler moved, instead of letting four golden tests go red and read
      # like a numerical regression.
      - name: Select the reference C++ compiler
        run: |
          major=$(g++ -dumpversion | cut -d. -f1)
          if [ "$major" = "13" ]; then
            echo "default g++ is ${major}.x - using it"
          elif command -v g++-13 >/dev/null; then
            echo "default g++ is ${major}.x - switching to g++-13"
            echo "CC=gcc-13"  >> "$GITHUB_ENV"
            echo "CXX=g++-13" >> "$GITHUB_ENV"
          else
            echo "::error::container g++ is ${major}.x and g++-13 is not present."
            echo "::error::Pin the job's container back to an image whose default g++ is 13.x,"
            echo "::error::or add g++-13 gcc-13 to the toolchain install step above."
            exit 1
          fi

      - name: Build and install (with dev extras for the test suite)
        run: python -m pip install -e ".[dev]" -v

      - name: Import smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import tessera, tessera._tessera, tessera.quantum
          print("tessera  ->", tessera.__file__)
          print("_tessera ->", tessera._tessera.__file__)
          assert hasattr(tessera, "quantum"), "tessera.quantum is missing"
          print("quantum subsystem present")
          PY

      # The editable install above keeps conftest.py's xdist-unsafe build
      # fallback dormant (its fast path returns as soon as ``tessera._tessera``
      # imports), so the suite below can shard across workers safely.
      #
      # Thread budget: this suite is BLAS / OpenMP bound. Its heaviest tests
      # (cobordism relaxations, the example subprocesses) thread-scale, so a
      # naive OMP_NUM_THREADS=1 with a worker per core regresses: a
      # single-threaded long pole floors the wall clock and every worker
      # re-pays the heavy module imports. The split below spends the budget as
      # TESSERA_TEST_THREADS_PER_WORKER threads inside each test and
      # TESSERA_TEST_CPUS / TESSERA_TEST_THREADS_PER_WORKER tests at once.
      #
      # PR pushes run only the fast lane (the ``slow`` tests deselected);
      # merge-to-main, the nightly schedule, and manual dispatch run the FULL
      # suite. Coverage is split, never cut — every ``slow`` test still runs on
      # main/nightly. Both lanes run from the repo root so pytest finds tests/.
      - name: Run fast test suite (PR pushes)
        if: github.event_name == 'pull_request'
        env:
          OMP_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          OPENBLAS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          MKL_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          BLIS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
        run: |
          python -m pytest tests/ -q -m "not slow" \
            -n "$(.github/scripts/test-workers.sh)" --dist worksteal

      - name: Run full test suite (main / nightly / manual)
        if: github.event_name != 'pull_request'
        env:
          OMP_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          OPENBLAS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          MKL_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
          BLIS_NUM_THREADS: ${{ env.TESSERA_TEST_THREADS_PER_WORKER }}
        run: |
          python -m pytest tests/ -q \
            -n "$(.github/scripts/test-workers.sh)" --dist worksteal
