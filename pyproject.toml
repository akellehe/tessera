[build-system]
requires = [
#    "cmake>=3.22",
#    "ninja",                # optional but faster on CI
    "pybind11>=3.0",
    "scikit-build-core>=0.9",
    "numpy>=2.3.4",
    "pybind11-stubgen==2.5.5"
]
build-backend = "scikit_build_core.build"

[project]
name = "tessera"
version = "0.1.0"
description = "C++/pybind11 extension for lattice spacetime experiments"
authors = [{ name = "Andrew Kelleher", email = "keats.kelleher@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.0",
]
optional-dependencies.examples = [
    "matplotlib>=3.8",
    "networkx>=3.0",
    "scipy>=1.11",
    "tqdm>=4.66",
]
# Reinforcement-learning harness for the cobordism objective search: a libtorch C++
# actor-critic (the `_tessera_rl` extension, driven via `tessera.rl`) that learns the
# surgery + relaxation search policy over MultiCobordism.buildStep. The pip `torch` package
# supplies libtorch both to BUILD _tessera_rl (find_package(Torch); use --no-build-isolation
# so the build sees it) and at runtime; it is heavy and only the RL needs it, so it is its
# own extra rather than a core/examples dependency.
optional-dependencies.rl = [
    "torch>=2.0",
]
# A GUI toolkit binding, so `emergence_animation.py run --live` has a window to
# draw into. matplotlib alone resolves to Agg, which renders to files and shows
# nothing, so --live refuses to start under it rather than compute every frame
# and display none of them. Its own extra rather than part of `examples`: every
# campaign on a headless box renders to --out and has no use for Qt.
optional-dependencies.live = [
    "PyQt6>=6.6",
]
optional-dependencies.dev = [
    "tessera[examples]",
    "tessera[live]",
    "pytest",
    "pytest-xdist",
    "scikit-build-core>=0.9",
    "cmake>=3.22",
    "ninja",
    "pybind11>=3.0",
    "pybind11-stubgen==2.5.5",
    "sphinx==8.2.3",
    "furo==2025.9.25",
    "myst_parser==4.0.1",
    "breathe==4.36.0",
    "sphinxcontrib-bibtex>=2.6,<3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that take >30s (deselect with '-m \"not slow\"')",
]

[tool.scikit-build]
build-dir = "cmake-build-debug/{wheel_tag}"
# Default Release (-O3) — perf/compute. Fast dev compiles want Debug (-O1, ccache-friendly):
#   pip install -e ".[dev]" -C cmake.build-type=Debug
# but the Debug build currently aborts at `import tessera` (free(): invalid pointer) — a
# latent invalid-free that -O3 masks. Fix that before relying on the Debug dev build.
# RelWithDebInfo = the Release build plus DWARF (#682): pybind11_add_module
# post-build STRIPS Release modules (that is where the empty symbol table came
# from — perf/addr2line were snapping hot static functions to the nearest
# exported symbol, 81 KB off), but exempts RelWithDebInfo while keeping its
# LTO extras. The flag pins below replace CMake's default RelWithDebInfo
# "-O2 -g" with exactly the Release codegen plus DWARF, so runtime behavior
# and performance are identical to the old Release build; only the .so grows.
cmake.build-type = "RelWithDebInfo"
install.strip = false
wheel.packages = ["tessera"]

[tool.scikit-build.cmake.define]
# -march=native: the module is built locally by `pip install -e`, never
# shipped as a wheel, so targeting the host ISA is free. Without it the
# build targets generic x86-64 — SSE2 only, no FMA — and Eigen's dense
# kernels run at half the vector width (#733: measured 2.02x on the full
# r_U evaluation at 261 cells). Use -march=x86-64-v3 instead if a build
# ever has to run on a different machine; it measured the same here.
CMAKE_CXX_FLAGS_RELWITHDEBINFO = "-O3 -g -gz -DNDEBUG -march=native -mtune=native"
CMAKE_CUDA_FLAGS_RELWITHDEBINFO = "-O3 -g -DNDEBUG"
# Do NOT add a [tool.scikit-build.cmake.define] override for Python_EXECUTABLE.
# scikit-build-core already sets it (and CMAKE_PREFIX_PATH) to the build
# interpreter; cmake.define values are passed verbatim, so a "${...}" token
# is not interpolated — it lands in CMake as a literal bogus path and makes
# find_package(Python) fall back to the wrong interpreter.

# Optional libtorch RL extension (_tessera_rl), built under NORMAL build isolation.
# The RL module compiles against libtorch, so torch must be visible to the build
# interpreter. It cannot go in [build-system].requires (that would force a multi-GB
# torch download into EVERY build, including the torch-free core and CI), and an extra
# ([rl]) is invisible to the build backend — so neither of the obvious places works.
# Instead, gate an extra build requirement on the TESSERA_RL env var: when it is set,
# scikit-build-core adds torch to the isolated build env (via get_requires_for_build_*),
# find_package(Torch) then succeeds, and CMake compiles _tessera_rl. When it is unset,
# core builds stay completely torch-free. One command, standard isolation, no
# --no-build-isolation:
#     TESSERA_RL=1 pip install -e ".[rl]"
[[tool.scikit-build.overrides]]
if.env.TESSERA_RL = true
build.requires = ["torch>=2.0"]
